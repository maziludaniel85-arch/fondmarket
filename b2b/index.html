function Stars({v}){return <span className="inline-flex items-center gap-0.5" aria-label={`Rating ${v} din 5`}>{[1,2,3,4,5].map(i=><Star key={i} className={`h-3.5 w-3.5 ${i<=Math.round(v)?'fill-amber-400 text-amber-400':'text-slate-300'}`} aria-hidden="true"/>)}</span>}

<span><span className="block font-semibold">{t}</span><span className="block text-sm text-slate-500">{s}</span></span></label>)}

<td className="md:px-5 md:py-3.5"><div className="flex items-center gap-2"><div className="h-1.5 w-24 rounded-full bg-slate-100"><div className="h-1.5 rounded-full bg-navy-700" style={{width:p.used*100+'%'}}/></div><span className="num text-xs text-slate-500">{Math.round(p.used*100)}%</span></div></td>
<td className="text-right md:px-5 md:py-3.5 md:text-left"><Badge tone={stTone[p.status]}>{p.status}</Badge></td></tr>)}</tbody></table>
<div className="border-t border-line px-5 py-4"><h3 className="text-sm font-semibold">Cererile mele de ofertă</h3><ul className="mt-3 space-y-2">{rfqs.map(r=><li key={r.id} className={`flex flex-wrap items-center justify-between gap-2 rounded-lg border border-line px-3 py-2.5 ${r.fresh?'fade-in bg-emerald-50/50':''}`}><div className="min-w-0"><p className="truncate text-sm font-medium">{r.title}</p><p className="text-xs text-slate-500">CPV {r.cpv} · {lei(r.budget)} · până la {r.deadline}</p></div><Badge tone={r.offers?'navy':'slate'} icon={r.offers?FileText:Hourglass}>{r.offers?`${r.offers} oferte`:'Așteaptă oferte'}</Badge></li>)}</ul></div>
</Card>

<Card className="p-5"><h2 className="flex items-center gap-2 font-semibold"><FileText className="h-4 w-4 text-navy-700" aria-hidden="true"/>Publică o cerere de ofertă (RFQ)</h2><p className="mt-1 text-sm text-slate-500">Ajunge doar la furnizori verificați din domeniul codului CPV.</p>
<form onSubmit={submit} noValidate className="mt-5 space-y-4">
<Field id="t-title" label="Ce vrei să cumperi" error={err.title}><input id="t-title" className={inputCls} placeholder="Laptopuri pentru recepție (2 buc.)" value={f.title} onChange={e=>upd('title',e.target.value)} aria-invalid={!!err.title}/></Field>
<Field id="t-proj" label="Proiect"><select id="t-proj" className={inputCls} value={f.project} onChange={e=>upd('project',e.target.value)}>{PROJECTS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></Field>
<div className="grid gap-4 sm:grid-cols-2">
<Field id="t-cpv" label="Cod CPV" error={err.cpv} hint={cpvInfo?cpvInfo[1]:'Alege din listă sau scrie codul'}><input id="t-cpv" list="cpvs" className={`${inputCls} num`} placeholder="30213100-6" value={f.cpv} onChange={e=>upd('cpv',e.target.value)} aria-invalid={!!err.cpv}/><datalist id="cpvs">{CPV.map(c=><option key={c[0]} value={c[0]}>{c[1]}</option>)}</datalist></Field>
<Field id="t-bud" label="Buget estimat, fără TVA" error={err.budget}><div className="relative"><input id="t-bud" type="number" min="0" step="100" inputMode="numeric" className={`${inputCls} num pr-10`} placeholder="25000" value={f.budget} onChange={e=>upd('budget',e.target.value)} aria-invalid={!!err.budget}/><span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">lei</span></div></Field>
</div>
<Field id="t-dl" label="Termen pentru oferte"><input id="t-dl" type="date" className={inputCls} value={f.deadline} onChange={e=>upd('deadline',e.target.value)}/></Field>
<Field id="t-desc" label="Specificații minime" hint="Opțional. Le preluăm din proiectul aprobat dacă îl încarci."><textarea id="t-desc" rows="3" className={`${inputCls} py-2`} placeholder="16 GB RAM, SSD 512 GB, ecran 15 inch" value={f.desc} onChange={e=>upd('desc',e.target.value)}/></Field>
<Btn type="submit" className="w-full"><Send className="h-4 w-4" aria-hidden="true"/>Publică cererea</Btn>
</form></Card></div>

<section className="mt-8"><div className="flex flex-wrap items-end justify-between gap-2"><div><h2 className="text-lg font-semibold">Oferte primite</h2><p className="text-sm text-slate-500">De la furnizori verificați. Ofertele sub specificațiile minime sunt marcate.</p></div><Badge tone="navy" icon={ShieldCheck}>Verificare automată conformitate</Badge></div>
<div className="mt-4 grid gap-4 md:grid-cols-2 xl:grid-cols-4">{offers.map(o=><Card key={o.id} className={`flex flex-col p-5 transition ${o.status==='acceptată'?'ring-2 ring-emerald-500':''} ${o.status==='respinsă'?'opacity-60':''}`}>
<div className="flex items-start justify-between gap-2"><div className="min-w-0"><p className="flex items-center gap-1.5 font-semibold">{o.supplier}{o.verified&&<BadgeCheck className="h-4 w-4 text-navy-600" aria-label="Furnizor verificat"/>}</p><p className="flex items-center gap-1 text-xs text-slate-500"><MapPin className="h-3 w-3" aria-hidden="true"/>{o.city} · {o.years} ani pe piață</p></div></div>
<p className="mt-2 line-clamp-2 text-xs text-slate-500">{o.rfq}</p>
<div className="mt-3 flex items-center gap-2 text-sm"><Stars v={o.rating}/><span className="font-medium">{o.rating}</span><span className="text-slate-400">({o.reviews})</span></div>
<div className="mt-3 flex flex-wrap gap-1.5">{o.verified?<Badge tone="navy" icon={ShieldCheck}>Verificat ONRC</Badge>:<Badge tone="amber">Neverificat</Badge>}{o.conform?<Badge tone="emerald" icon={CheckCircle2}>Conformă</Badge>:<Badge tone="rose">Sub specificații</Badge>}</div>
{o.note&&<p className="mt-2 text-xs text-rose-600">{o.note}</p>}
<dl className="mt-4 grid grid-cols-3 gap-2 border-t border-line pt-3 text-xs"><div><dt className="text-slate-500">Preț</dt><dd className="num text-sm font-semibold">{lei(o.price)}</dd></div><div><dt className="text-slate-500">Livrare</dt><dd className="text-sm font-semibold">{o.days} zile</dd></div><div><dt className="text-slate-500">Garanție</dt><dd className="text-sm font-semibold">{o.warranty} luni</dd></div></dl>
<div className="mt-auto flex gap-2 pt-4 [&>*]:flex-1">{o.status==='acceptată'?<Badge tone="emerald" icon={Trophy}>Acceptată</Badge>:o.status==='respinsă'?<span className="text-center text-xs text-slate-500">Necâștigătoare</span>:<><Btn variant="ghost" className="px-3"><Eye className="h-4 w-4" aria-hidden="true"/>Detalii</Btn><Btn className="px-3" disabled={!o.conform} onClick={()=>accept(o.id)} title={o.conform?'':'Oferta nu îndeplinește specificațiile minime'}>Acceptă</Btn></>}</div>
</Card>)}</div></section>
</>}
</main>}

/* ---------------- FURNIZOR ---------------- */
function Furnizor({toast}){
const [dom,setDom]=useState('Toate');const [prog,setProg]=useState('Toate');const [q,setQ]=useState('');
const [track,setTrack]=useState(TRACK0);const [modal,setModal]=useState(null);
const sent=new Set(track.map(t=>t.title));
const feed=FEED.filter(f=>(dom==='Toate'||f.domain===dom)&&(prog==='Toate'||f.program===prog)&&(!q||(f.title+f.buyer+f.cpv).toLowerCase().includes(q.toLowerCase())));
const cols=[['trimisa','Trimisă',Send,'slate'],['evaluare','În evaluare',Hourglass,'amber'],['castigata','Câștigată',Trophy,'emerald']];
const next={trimisa:'evaluare',evaluare:'castigata'};
const won=track.filter(t=>t.status==='castigata').reduce((a,t)=>a+t.price,0);
return <main className="fade-in mx-auto max-w-7xl px-4 py-8 sm:px-6">
<div className="flex flex-wrap items-end justify-between gap-3"><div><p className="text-sm text-slate-500">TechDepo Distribuție SRL · furnizor verificat</p><h1 className="text-2xl font-bold tracking-tight sm:text-3xl">Oportunități pentru tine</h1></div><div className="flex items-center gap-2"><Badge tone="emerald" icon={Gift}>Gratuit pentru furnizori</Badge><Badge tone="navy" icon={BadgeCheck}>Verificat ONRC</Badge><Badge tone="slate" icon={Star}>4,9 din 128 recenzii</Badge></div></div>

<section aria-labelledby="trk" className="mt-6"><div className="flex flex-wrap items-end justify-between gap-2"><h2 id="trk" className="font-semibold">Ofertele mele</h2><p className="text-sm text-slate-500">Valoare câștigată: <span className="num font-semibold text-emerald-700">{lei(won)}</span></p></div>
<div className="mt-3 grid gap-4 md:grid-cols-3">{cols.map(([k,l,Ic,tone])=>{const items=track.filter(t=>t.status===k);return <div key={k} className="rounded-xl border border-line bg-white/60 p-3">
<div className="flex items-center justify-between px-1 pb-2"><span className="flex items-center gap-2 text-sm font-semibold"><Ic className={`h-4 w-4 ${tone==='emerald'?'text-emerald-600':tone==='amber'?'text-amber-600':'text-slate-500'}`} aria-hidden="true"/>{l}</span><span className="num rounded-full bg-slate-100 px-2 text-xs font-semibold text-slate-600">{items.length}</span></div>
<ul className="space-y-2">{items.map(t=><li key={t.id} className={`fade-in rounded-lg border border-line bg-white p-3 shadow-card ${k==='castigata'?'border-l-4 border-l-emerald-500':''}`}><p className="text-sm font-medium">{t.title}</p><p className="text-xs text-slate-500">{t.buyer}</p><div className="mt-2 flex items-center justify-between"><span className="num text-sm font-semibold">{lei(t.price)}</span>{next[k]&&<button onClick={()=>{setTrack(tr=>tr.map(x=>x.id===t.id?{...x,status:next[k]}:x));if(next[k]==='castigata')toast(`Felicitări, ai câștigat: ${t.title}.`)}} className="flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-50">Simulează pasul următor<ChevronRight className="h-3.5 w-3.5" aria-hidden="true"/></button>}</div></li>)}
{!items.length&&<li className="rounded-lg border border-dashed border-line p-4 text-center text-xs text-slate-500">Nimic aici încă</li>}</ul></div>})}</div></section>

<section className="mt-8"><h2 className="font-semibold">Feed de cereri de ofertă</h2>
<Card className="mt-3 p-3"><div className="flex flex-col gap-3 lg:flex-row lg:items-center">
<div className="relative flex-1"><Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" aria-hidden="true"/><input aria-label="Caută cereri" className={`${inputCls} pl-9`} placeholder="Caută după titlu, beneficiar sau CPV" value={q} onChange={e=>setQ(e.target.value)}/></div>
<select aria-label="Domeniu" className={`${inputCls} lg:w-56`} value={dom} onChange={e=>setDom(e.target.value)}><option value="Toate">Toate categoriile</option>{DOMAINS.map(d=><option key={d}>{d}</option>)}</select>
<select aria-label="Etapă" className={`${inputCls} lg:w-56`} value={prog} onChange={e=>setProg(e.target.value)}><option value="Toate">Înscriere și implementare</option>{PROGRAMS.map(p=><option key={p}>{p}</option>)}</select>
</div></Card>
<p className="mt-3 text-sm text-slate-500">{feed.length} {feed.length===1?'cerere':'cereri'} potrivite</p>
<ul className="mt-2 space-y-3">{feed.map(f=>{const done=sent.has(f.title);return <li key={f.id}><Card className="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
<span className={`grid h-11 w-11 shrink-0 place-items-center rounded-lg ${f.kind==='Aplicant'?'bg-amber-50 text-amber-700':'bg-navy-50 text-navy-700'}`}>{f.kind==='Aplicant'?<Rocket className="h-5 w-5" aria-hidden="true"/>:<Building2 className="h-5 w-5" aria-hidden="true"/>}</span>
<div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><p className="font-semibold">{f.title}</p><ProgramBadge p={f.program}/>{f.kind==='Aplicant'&&<Badge tone="amber" icon={Rocket}>Viitor beneficiar</Badge>}</div>
<p className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-500"><span className="flex items-center gap-1"><Users className="h-3.5 w-3.5" aria-hidden="true"/>{f.buyer} · {f.kind}</span><span className="flex items-center gap-1"><MapPin className="h-3.5 w-3.5" aria-hidden="true"/>{f.city}</span><span className="flex items-center gap-1"><Tag className="h-3.5 w-3.5" aria-hidden="true"/>CPV {f.cpv}</span><span className="flex items-center gap-1"><Clock className="h-3.5 w-3.5" aria-hidden="true"/>până la {f.deadline}</span></p></div>
<div className="flex items-center justify-between gap-4 sm:flex-col sm:items-end"><div className="text-right"><p className="text-xs text-slate-500">Buget estimat</p><p className="num font-semibold">{lei(f.budget)}</p><p className="text-xs text-slate-500">{f.offers} oferte trimise</p></div>
{done?<Badge tone="emerald" icon={CheckCircle2}>Ofertă trimisă</Badge>:<Btn onClick={()=>setModal(f)}><Send className="h-4 w-4" aria-hidden="true"/>Trimite ofertă</Btn>}</div></Card></li>})}
{!feed.length&&<li className="rounded-xl border border-dashed border-line bg-white p-8 text-center text-sm text-slate-500">Nicio cerere pentru filtrele alese. Încearcă alt domeniu sau program.</li>}</ul></section>
{modal&&<OfferModal rfq={modal} onClose={()=>setModal(null)} onSend={o=>{setTrack(t=>[{id:'T'+Date.now(),title:modal.title,buyer:modal.buyer,price:o.price,status:'trimisa'},...t]);setModal(null);toast('Oferta a fost trimisă în numele firmei tale. O găsești în coloana Trimisă.')}}/>}
</main>}

function OfferModal({rfq,onClose,onSend}){
const [p,setP]=useState(Math.round(rfq.budget*0.95));const [d,setD]=useState(7);const [w,setW]=useState(24);const [m,setM]=useState('');const [err,setErr]=useState('');const ref=useRef();
useEffect(()=>{ref.current&&ref.current.focus();const k=e=>{if(e.key==='Escape')onClose()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
const over=p>rfq.budget;
function submit(e){e.preventDefault();if(!(p>0)){setErr('Introdu un preț mai mare de 0.');return}onSend({price:Number(p)})}
return ReactDOM.createPortal(<div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 p-0 backdrop-blur-sm sm:items-center sm:p-4" onClick={onClose}>
<div role="dialog" aria-modal="true" aria-labelledby="mt" className="fade-in max-h-[92vh] w-full overflow-y-auto rounded-t-2xl bg-white shadow-lift sm:max-w-lg sm:rounded-2xl" onClick={e=>e.stopPropagation()}>
<div className="flex items-start justify-between gap-3 border-b border-line px-5 py-4"><div><h2 id="mt" className="font-semibold">Trimite ofertă</h2><p className="text-sm text-slate-500">{rfq.title} · {rfq.buyer}</p></div><button onClick={onClose} aria-label="Închide" className="grid h-9 w-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100"><X className="h-5 w-5"/></button></div>
<form onSubmit={submit} className="space-y-4 px-5 py-5" noValidate>
<div className="grid gap-4 sm:grid-cols-3">
<div className="sm:col-span-3"><Field id="o-p" label="Preț total, fără TVA" error={err} hint={over?`Peste bugetul estimat de ${lei(rfq.budget)}. Beneficiarul acoperă diferența din cofinanțare.`:`Buget estimat: ${lei(rfq.budget)}`}><div className="relative"><input ref={ref} id="o-p" type="number" min="0" inputMode="numeric" className={`${inputCls} num pr-10`} value={p} onChange={e=>{setP(e.target.value);setErr('')}}/><span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">lei</span></div></Field></div>
<Field id="o-d" label="Livrare (zile)"><input id="o-d" type="number" min="1" className={`${inputCls} num`} value={d} onChange={e=>setD(e.target.value)}/></Field>
<Field id="o-w" label="Garanție (luni)"><input id="o-w" type="number" min="0" className={`${inputCls} num`} value={w} onChange={e=>setW(e.target.value)}/></Field>
<Field id="o-v" label="Valabilitate"><select id="o-v" className={inputCls}><option>30 zile</option><option>60 zile</option><option>90 zile</option></select></Field>
</div>
<Field id="o-m" label="Specificații și mesaj"><textarea id="o-m" rows="3" className={`${inputCls} py-2`} placeholder="Model, caracteristici tehnice, condiții de livrare" value={m} onChange={e=>setM(e.target.value)}/></Field>
<div className="flex items-start gap-2 rounded-lg bg-navy-50 p-3 text-xs text-navy-800"><ShieldCheck className="mt-0.5 h-4 w-4 shrink-0" aria-hidden="true"/>Oferta pleacă în numele firmei tale, cu antetul și datele din profil. Declari că nu ai legături de rudenie sau de acționariat cu beneficiarul.</div>
<div className="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><Btn type="button" variant="ghost" onClick={onClose}>Renunță</Btn><Btn type="submit"><Send className="h-4 w-4" aria-hidden="true"/>Trimite oferta</Btn></div>
</form></div></div>,document.body)}

function App(){
const init=()=>{const h=location.hash.slice(1);return ['landing','aplicant','beneficiar','furnizor'].includes(h)?h:'landing'};
const [view,setV]=useState(init);const [msg,setMsg]=useState('');
const setView=v=>{setV(v);try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo({top:0})};
useEffect(()=>{const f=()=>setV(init());addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
return <div className="min-h-screen"><Nav view={view} setView={setView}/>
{view==='landing'&&<Landing setView={setView}/>}{view==='aplicant'&&<Aplicant toast={setMsg} setView={setView}/>}{view==='beneficiar'&&<Beneficiar toast={setMsg}/>}{view==='furnizor'&&<Furnizor toast={setMsg}/>}
<Toast msg={msg} onClose={()=>setMsg('')}/></div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
