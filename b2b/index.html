<script type="text/babel" data-presets="react">

const I=window.LucideReact;

const PROGRAMS=['PNRR','Fonduri Europene','Start-Up Nation','Programe regionale'];
const PCOLOR={'PNRR':'bg-navy-50 text-navy-700 ring-navy-100','Fonduri Europene':'bg-sky-50 text-sky-700 ring-sky-100','Start-Up Nation':'bg-violet-50 text-violet-700 ring-violet-100','Programe regionale':'bg-amber-50 text-amber-700 ring-amber-100'};

const CPV=[['30213100-6','Calculatoare portabile','Echipamente IT'],['48000000-8','Pachete software','Software'],['72000000-5','Servicii IT','Servicii IT'],['39130000-2','Mobilier de birou','Mobilier'],['09331200-0','Panouri fotovoltaice','Energie verde'],['79411000-8','Consultanță în management','Consultanță'],['33100000-1','Echipamente medicale','Echipamente medicale']];

{id:'O2',rfq:'Laptopuri pentru echipa clinică (6 buc.)',supplier:'NetPro Systems',city:'Iași',price:29950,days:8,warranty:24,rating:4.6,reviews:54,verified:true,conform:true,years:7,status:'nouă'},
{id:'O3',rfq:'Laptopuri pentru echipa clinică (6 buc.)',supplier:'Office Point',city:'Cluj-Napoca',price:27400,days:12,warranty:24,rating:4.1,reviews:19,verified:false,conform:false,years:2,status:'nouă',note:'8 GB RAM, sub minimul cerut de 16 GB'},
{id:'O4',rfq:'Software gestiune programări',supplier:'Clinica Soft',city:'Timișoara',price:18500,days:21,warranty:12,rating:4.8,reviews:76,verified:true,conform:true,years:9,status:'nouă'}];

const FEED=[
{id:'F1',title:'Laptopuri pentru echipa clinică (6 buc.)',buyer:'Dental Line SRL',kind:'IMM',city:'Constanța',program:'PNRR',domain:'Echipamente IT',cpv:'30213100-6',budget:33000,deadline:'28.11.2026',offers:3},

{id:'F3',title:'Mobilier birouri, 14 posturi',buyer:'Atelier Verde SRL',kind:'IMM',city:'Sibiu',program:'Programe regionale',domain:'Mobilier',cpv:'39130000-2',budget:56000,deadline:'03.12.2026',offers:5},

{id:'F5',title:'Consultanță implementare proiect',buyer:'Cafeneaua Colț SRL',kind:'Startup',city:'Brașov',program:'Start-Up Nation',domain:'Consultanță',cpv:'79411000-8',budget:10000,deadline:'01.12.2026',offers:4},

{id:'F8',title:'Ofertă pentru înscriere: espressor 2 grupuri',buyer:'Ioana M., aplicant Start-Up Nation',kind:'Aplicant',city:'Cluj-Napoca',program:'Start-Up Nation',domain:'Echipamente HoReCa',cpv:'39221000-7',budget:18000,deadline:'26.11.2026',offers:1},
{id:'F9',title:'Ofertă pentru înscriere: laptop și imprimantă 3D',buyer:'Radu P., aplicant Start-Up Nation',kind:'Aplicant',city:'Iași',program:'Start-Up Nation',domain:'Echipamente IT',cpv:'30213100-6',budget:14100,deadline:'27.11.2026',offers:0},
{id:'F7',title:'Servicii migrare cloud și securitate',buyer:'Logistic Fast SRL',kind:'IMM',city:'Ploiești',program:'Fonduri Europene',domain:'Servicii IT',cpv:'72000000-5',budget:240000,deadline:'18.12.2026',offers:2}];

const TRACK0=[{id:'T1',title:'Mobilier birouri, 14 posturi',buyer:'Atelier Verde SRL',price:52900,status:'evaluare'},{id:'T2',title:'Servicii migrare cloud și securitate',buyer:'Logistic Fast SRL',price:228000,status:'trimisa'},{id:'T3',title:'Echipamente IT școală gimnazială',buyer:'Primăria Comunei Corbeanca',price:96400,status:'castigata'}];

function Badge({children,tone='slate',icon:Ic}){const t={slate:'bg-slate-50 text-slate-700 ring-slate-200',navy:'bg-navy-50 text-navy-700 ring-navy-100',emerald:'bg-emerald-50 text-emerald-700 ring-emerald-100',amber:'bg-amber-50 text-amber-700 ring-amber-100',rose:'bg-rose-50 text-rose-700 ring-rose-100'}[tone]||tone;return <span className={`inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset whitespace-nowrap ${t}`}>{Ic&&<Ic className="h-3.5 w-3.5" aria-hidden="true"/>}{children}</span>}
const ProgramBadge=({p})=><span className={`inline-flex rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset whitespace-nowrap ${PCOLOR[p]}`}>{p}</span>;
const Card=({className='',children})=><div className={`rounded-xl border border-line bg-white shadow-card ${className}`}>{children}</div>;
function Btn({variant='primary',className='',children,...p}){const v={primary:'bg-emerald-500 text-white hover:bg-emerald-600 focus-visible:outline-emerald-500',navy:'bg-navy-700 text-white hover:bg-navy-800 focus-visible:outline-navy-700',ghost:'bg-white text-slate-700 ring-1 ring-inset ring-line hover:bg-slate-50 focus-visible:outline-navy-700'}[variant];return <button {...p} className={`inline-flex min-h-[40px] items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50 ${v} ${className}`}>{children}</button>}
function Stars({v}){return <span className="inline-flex items-center gap-0.5" aria-label={`Rating ${v} din 5`}>{[1,2,3,4,5].map(i=><Star key={i} className={`h-3.5 w-3.5 ${i<=Math.round(v)?'fill-amber-400 text-amber-400':'text-slate-300'}`} aria-hidden="true"/>)}</span>}
const Field=({label,hint,error,children,id})=><div className="flex flex-col gap-1.5"><label htmlFor={id} className="text-sm font-medium text-slate-700">{label}</label>{children}{error?<p className="text-xs text-rose-600">{error}</p>:hint&&<p className="text-xs text-slate-500">{hint}</p>}</div>;
const inputCls="min-h-[40px] w-full rounded-lg border border-line bg-white px-3 text-[15px] text-slate-900 placeholder:text-slate-400 focus:border-navy-600 focus:outline-none focus:ring-4 focus:ring-navy-100";

function Toast({msg,onClose}){useEffect(()=>{if(!msg)return;const t=setTimeout(onClose,4500);return()=>clearTimeout(t)},[msg]);if(!msg)return null;return <div className="pointer-events-none fixed inset-x-0 bottom-5 z-50 flex justify-center px-4"><div role="status" className="fade-in pointer-events-auto flex w-full max-w-[440px] items-start gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-lift"><CheckCircle2 className="mt-0.5 h-5 w-5 shrink-0 text-emerald-400" aria-hidden="true"/><span className="flex-1">{msg}</span><button onClick={onClose} aria-label="Închide" className="text-slate-400 hover:text-white"><X className="h-4 w-4"/></button></div></div>}

function Nav({view,setView}){const tabs=[['landing','Prezentare',Sparkles],['aplicant','Înscriere SUN',Rocket],['beneficiar','Beneficiar',Building2],['furnizor','Furnizor',Store]];
return <header className="sticky top-0 z-40 border-b border-line bg-white/85 backdrop-blur">
<div className="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-3 sm:px-6">
<button onClick={()=>setView('landing')} className="flex items-center gap-2"><span className="grid h-8 w-8 place-items-center rounded-lg bg-navy-700 text-white"><Landmark className="h-4 w-4" aria-hidden="true"/></span><span className="text-[17px] font-bold tracking-tight">FondMarket</span></button>
<nav aria-label="Vizualizări" className="order-3 flex w-full gap-1 overflow-x-auto rounded-lg bg-slate-100 p-1 sm:order-none sm:ml-6 sm:w-auto">
{tabs.map(([k,l,Ic])=><button key={k} onClick={()=>setView(k)} aria-current={view===k?'page':undefined} className={`flex min-h-[36px] flex-none items-center gap-2 rounded-md px-3 text-sm font-medium transition ${view===k?'bg-white text-navy-700 shadow-card':'text-slate-600 hover:text-slate-900'}`}><Ic className="h-4 w-4" aria-hidden="true"/>{l}</button>)}
</nav>
<div className="ml-auto flex items-center gap-2">
<button aria-label="Notificări" className="relative grid h-9 w-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100"><Bell className="h-5 w-5"/><span className="absolute right-2 top-2 h-2 w-2 rounded-full bg-emerald-500"/></button>
<span className="grid h-9 w-9 place-items-center rounded-full bg-navy-100 text-xs font-semibold text-navy-700">{view==='furnizor'?'TD':'DL'}</span>
</div></div></header>}

/* ---------------- LANDING ---------------- */
function Landing({setView}){
const [role,setRole]=useState('beneficiar');const [prog,setProg]=useState('Toate');
const list=FEED.filter(f=>prog==='Toate'||f.program===prog);
const total=list.reduce((a,f)=>a+f.budget,0);
const steps=role==='aplicant'?[[ShoppingCart,'Alegi echipamentele pe categorii','Catalog de produse de la furnizori verificați, cu prețuri orientative și eligibilitatea fiecărui produs în program.'],[Calculator,'Îți vezi bugetul pe loc','Totalul, grantul de până la 250.000 lei și cofinanțarea de minim 10% se calculează pe măsură ce adaugi produse.'],[FileText,'Primești ofertele pentru depunere','Furnizorii îți trimit oferte de preț în numele lor, gratuit. După aprobare, devin specificațiile minime pentru achiziție.']]:role==='beneficiar'?[[FileText,'Publici cererea de ofertă','Descrii nevoia, alegi codul CPV și bugetul estimat. Specificațiile minime din proiectul aprobat se preiau automat.'],[ShieldCheck,'Primești 3+ oferte verificate','Doar furnizori cu firmă verificată, fără conflict de interese, cu istoric și rating de la alți beneficiari.'],[CheckCircle2,'Alegi și exporți dosarul','Comparația, procesul-verbal de selecție și dovezile de transmitere ies gata pentru cererea de rambursare.']]
:[[Search,'Găsești cereri finanțate','Feed filtrat pe domeniul tău și pe programul de finanțare, cu buget estimat și termen.'],[Send,'Trimiți oferta în 2 minute','Ofertă în numele firmei tale, cu specificații verificate automat față de cerință.'],[Trophy,'Urmărești și câștigi','Vezi starea fiecărei oferte, de la trimisă la câștigată, și primești plata din contul dedicat proiectului.']];
return <main className="fade-in">
<section className="mx-auto grid max-w-7xl gap-10 px-4 pb-14 pt-10 sm:px-6 lg:grid-cols-[1.05fr_1fr] lg:pt-16">
<div>

<h1 className="mt-5 text-4xl font-extrabold leading-[1.05] tracking-tight text-slate-900 sm:text-5xl">Achiziții pentru proiecte finanțate, fără dosare întoarse.</h1>
<p className="mt-4 max-w-xl text-lg leading-relaxed text-slate-600">FondMarket conectează antreprenori, IMM-uri și primării cu furnizori verificați de echipamente, software și servicii. Cereri de ofertă, oferte comparabile și documente gata de decont.</p>
<fieldset className="mt-8"><legend className="text-sm font-medium text-slate-700">Sunt</legend>
<div className="mt-2 grid gap-2 sm:grid-cols-3 lg:grid-cols-1">
{[['aplicant','Mă înscriu în Start-Up Nation','Am nevoie de oferte pentru depunere',Rocket],['beneficiar','Am finanțarea aprobată','Cumpăr echipamentele din proiect',Building2],['furnizor','Sunt furnizor','Gratuit: primesc cereri de ofertă',Store]].map(([k,t,s,Ic])=>
<label key={k} className={`flex cursor-pointer items-center gap-3 rounded-xl border bg-white p-3 transition ${role===k?'border-navy-700 ring-4 ring-navy-100':'border-line hover:border-slate-300'}`}>
<input type="radio" name="role" value={k} checked={role===k} onChange={()=>setRole(k)} className="sr-only"/>
<span className={`grid h-10 w-10 shrink-0 place-items-center rounded-lg ${role===k?'bg-navy-700 text-white':'bg-slate-100 text-slate-600'}`}><Ic className="h-5 w-5" aria-hidden="true"/></span>
<span><span className="block font-semibold">{t}</span><span className="block text-sm text-slate-500">{s}</span></span></label>)}
</div></fieldset>
<div className="mt-6 flex flex-wrap gap-3">
<Btn onClick={()=>setView(role)}>{role==='aplicant'?'Alege produsele pentru proiect':role==='beneficiar'?'Încarcă proiectul aprobat':'Vezi cererile de ofertă'}<ArrowRight className="h-4 w-4" aria-hidden="true"/></Btn>
<Btn variant="ghost" onClick={()=>document.getElementById('cum').scrollIntoView({behavior:'smooth'})}>Cum funcționează</Btn>
</div></div>

<div className="relative">
<Card className="overflow-hidden shadow-lift">
<div className="flex items-center justify-between border-b border-line px-5 py-3"><div className="flex items-center gap-2 text-sm font-semibold"><FileText className="h-4 w-4 text-navy-700" aria-hidden="true"/>CO-2026-0418</div><ProgramBadge p="PNRR"/></div>
<div className="px-5 py-4"><p className="font-semibold">Laptopuri pentru echipa clinică (6 buc.)</p><p className="mt-1 text-sm text-slate-500">CPV 30213100-6 · buget estimat {lei(33000)} · termen 28.11.2026</p></div>
<ul className="divide-y divide-line border-t border-line">
{OFFERS0.slice(0,3).map((o,i)=><li key={o.id} className={`flex items-center gap-3 px-5 py-3 ${i===1?'bg-emerald-50/60':''}`}>
<span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-slate-100 text-xs font-semibold text-slate-600">{o.supplier.split(' ').map(w=>w[0]).slice(0,2).join('')}</span>
<div className="min-w-0 flex-1"><p className="flex items-center gap-1.5 truncate text-sm font-medium">{o.supplier}{o.verified&&<BadgeCheck className="h-4 w-4 shrink-0 text-navy-600" aria-label="Verificat"/>}</p><div className="flex items-center gap-2 text-xs text-slate-500"><Stars v={o.rating}/>{o.rating}</div></div>
<div className="text-right"><p className="num text-sm font-semibold">{lei(o.price)}</p>{o.conform?(i===1?<Badge tone="emerald" icon={Trophy}>Recomandată</Badge>:<Badge tone="slate">Conformă</Badge>):<Badge tone="rose">Sub specificații</Badge>}</div></li>)}
</ul></Card>
<div className="absolute -bottom-5 -left-3 hidden rounded-xl border border-line bg-white px-4 py-3 shadow-lift sm:block"><p className="text-xs text-slate-500">Dosar de achiziție</p><p className="flex items-center gap-1.5 text-sm font-semibold text-emerald-700"><CheckCircle2 className="h-4 w-4" aria-hidden="true"/>Gata pentru decont</p></div>
</div></section>

<section className="border-y border-line bg-white">

<div className="flex items-center gap-2 text-sm font-medium text-slate-700"><Filter className="h-4 w-4" aria-hidden="true"/>Cereri active după programul de finanțare</div>

<div className="mt-6 grid gap-4 sm:grid-cols-3">
{[['Cereri deschise',list.length,FolderKanban],['Valoare estimată',lei(total),Wallet],['Furnizori verificați',prog==='Toate'?412:Math.round(412*list.length/FEED.length),ShieldCheck]].map(([l,v,Ic])=>

const out=[];titles.forEach((ti,k)=>{const end=k+1<titles.length?titles[k+1]:rows.length;const a=rows[anchors[k]].a;const seg=rows.slice(ti,end);

for(let i=1;i<=Math.min(doc.numPages,25);i++){const pg=await doc.getPage(i);try{await pg.getOperatorList()}catch(e){}const tc=await pg.getTextContent();const isB=fn=>{try{const f=pg.commonObjs.has(fn)?pg.commonObjs.get(fn):null;return !!f&&(/bold|black|heavy|semibold|demi/i.test(f.name||'')||f.bold)}catch(e){return false}};const rows={};tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push([it.transform[4],it.str,isB(it.fontName)])});

</>}

return <main className="fade-in mx-auto max-w-7xl px-4 py-8 sm:px-6">
<div className="flex flex-wrap items-end justify-between gap-3"><div><p className="text-sm text-slate-500">TechDepo Distribuție SRL · furnizor verificat</p><h1 className="text-2xl font-bold tracking-tight sm:text-3xl">Oportunități pentru tine</h1></div><div className="flex items-center gap-2"><Badge tone="emerald" icon={Gift}>Gratuit pentru furnizori</Badge><Badge tone="navy" icon={BadgeCheck}>Verificat ONRC</Badge><Badge tone="slate" icon={Star}>4,9 din 128 recenzii</Badge></div></div>

<section aria-labelledby="trk" className="mt-6"><div className="flex flex-wrap items-end justify-between gap-2"><h2 id="trk" className="font-semibold">Ofertele mele</h2><p className="text-sm text-slate-500">Valoare câștigată: <span className="num font-semibold text-emerald-700">{lei(won)}</span></p></div>
<div className="mt-3 grid gap-4 md:grid-cols-3">{cols.map(([k,l,Ic,tone])=>{const items=track.filter(t=>t.status===k);return <div key={k} className="rounded-xl border border-line bg-white/60 p-3">
<div className="flex items-center justify-between px-1 pb-2"><span className="flex items-center gap-2 text-sm font-semibold"><Ic className={`h-4 w-4 ${tone==='emerald'?'text-emerald-600':tone==='amber'?'text-amber-600':'text-slate-500'}`} aria-hidden="true"/>{l}</span><span className="num rounded-full bg-slate-100 px-2 text-xs font-semibold text-slate-600">{items.length}</span></div>
<ul className="space-y-2">{items.map(t=><li key={t.id} className={`fade-in rounded-lg border border-line bg-white p-3 shadow-card ${k==='castigata'?'border-l-4 border-l-emerald-500':''}`}><p className="text-sm font-medium">{t.title}</p><p className="text-xs text-slate-500">{t.buyer}</p><div className="mt-2 flex items-center justify-between"><span className="num text-sm font-semibold">{lei(t.price)}</span>{next[k]&&<button onClick={()=>{setTrack(tr=>tr.map(x=>x.id===t.id?{...x,status:next[k]}:x));if(next[k]==='castigata')toast(`Felicitări, ai câștigat: ${t.title}.`)}} className="flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium text-navy-700 hover:bg-navy-50">Simulează pasul următor<ChevronRight className="h-3.5 w-3.5" aria-hidden="true"/></button>}</div></li>)}
{!items.length&&<li className="rounded-lg border border-dashed border-line p-4 text-center text-xs text-slate-500">Nimic aici încă</li>}</ul></div>})}</div></section>

<section className="mt-8"><h2 className="font-semibold">Feed de cereri de ofertă</h2>
<Card className="mt-3 p-3"><div className="flex flex-col gap-3 lg:flex-row lg:items-center">
<div className="relative flex-1"><Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" aria-hidden="true"/><input aria-label="Caută cereri" className={`${inputCls} pl-9`} placeholder="Caută după titlu, beneficiar sau CPV" value={q} onChange={e=>setQ(e.target.value)}/></div>
<select aria-label="Domeniu" className={`${inputCls} lg:w-56`} value={dom} onChange={e=>setDom(e.target.value)}><option value="Toate">Toate domeniile</option>{DOMAINS.map(d=><option key={d}>{d}</option>)}</select>
<select aria-label="Program de finanțare" className={`${inputCls} lg:w-56`} value={prog} onChange={e=>setProg(e.target.value)}><option value="Toate">Toate programele</option>{PROGRAMS.map(p=><option key={p}>{p}</option>)}</select>
</div></Card>
<p className="mt-3 text-sm text-slate-500">{feed.length} {feed.length===1?'cerere':'cereri'} potrivite</p>
<ul className="mt-2 space-y-3">{feed.map(f=>{const done=sent.has(f.title);return <li key={f.id}><Card className="flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
<span className={`grid h-11 w-11 shrink-0 place-items-center rounded-lg ${f.kind==='Primărie'?'bg-navy-50 text-navy-700':'bg-slate-100 text-slate-600'}`}>{f.kind==='Primărie'?<Landmark className="h-5 w-5" aria-hidden="true"/>:f.kind==='Aplicant'?<Rocket className="h-5 w-5" aria-hidden="true"/>:<Building2 className="h-5 w-5" aria-hidden="true"/>}</span>
<div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-2"><p className="font-semibold">{f.title}</p><ProgramBadge p={f.program}/>{f.kind==='Aplicant'&&<Badge tone="amber" icon={Rocket}>Viitor beneficiar</Badge>}</div>
<p className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-500"><span className="flex items-center gap-1"><Users className="h-3.5 w-3.5" aria-hidden="true"/>{f.buyer} · {f.kind}</span><span className="flex items-center gap-1"><MapPin className="h-3.5 w-3.5" aria-hidden="true"/>{f.city}</span><span className="flex items-center gap-1"><Tag className="h-3.5 w-3.5" aria-hidden="true"/>CPV {f.cpv}</span><span className="flex items-center gap-1"><Clock className="h-3.5 w-3.5" aria-hidden="true"/>până la {f.deadline}</span></p></div>
<div className="flex items-center justify-between gap-4 sm:flex-col sm:items-end"><div className="text-right"><p className="text-xs text-slate-500">Buget estimat</p><p className="num font-semibold">{lei(f.budget)}</p><p className="text-xs text-slate-500">{f.offers} oferte trimise</p></div>
{done?<Badge tone="emerald" icon={CheckCircle2}>Ofertă trimisă</Badge>:<Btn onClick={()=>setModal(f)}><Send className="h-4 w-4" aria-hidden="true"/>Trimite ofertă</Btn>}</div></Card></li>})}
{!feed.length&&<li className="rounded-xl border border-dashed border-line bg-white p-8 text-center text-sm text-slate-500">Nicio cerere pentru filtrele alese. Încearcă alt domeniu sau program.</li>}</ul></section>
{modal&&<OfferModal rfq={modal} onClose={()=>setModal(null)} onSend={o=>{setTrack(t=>[{id:'T'+Date.now(),title:modal.title,buyer:modal.buyer,price:o.price,status:'trimisa'},...t]);setModal(null);toast('Oferta a fost trimisă în numele firmei tale. O găsești în coloana Trimisă.')}}/>}
</main>}

function OfferModal({rfq,onClose,onSend}){
const [p,setP]=useState(Math.round(rfq.budget*0.95));const [d,setD]=useState(7);const [w,setW]=useState(24);const [m,setM]=useState('');const [err,setErr]=useState('');const ref=useRef();
useEffect(()=>{ref.current&&ref.current.focus();const k=e=>{if(e.key==='Escape')onClose()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
const over=p>rfq.budget;
function submit(e){e.preventDefault();if(!(p>0)){setErr('Introdu un preț mai mare de 0.');return}onSend({price:Number(p)})}
return ReactDOM.createPortal(<div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 p-0 backdrop-blur-sm sm:items-center sm:p-4" onClick={onClose}>
<div role="dialog" aria-modal="true" aria-labelledby="mt" className="fade-in max-h-[92vh] w-full overflow-y-auto rounded-t-2xl bg-white shadow-lift sm:max-w-lg sm:rounded-2xl" onClick={e=>e.stopPropagation()}>
<div className="flex items-start justify-between gap-3 border-b border-line px-5 py-4"><div><h2 id="mt" className="font-semibold">Trimite ofertă</h2><p className="text-sm text-slate-500">{rfq.title} · {rfq.buyer}</p></div><button onClick={onClose} aria-label="Închide" className="grid h-9 w-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100"><X className="h-5 w-5"/></button></div>
<form onSubmit={submit} className="space-y-4 px-5 py-5" noValidate>
<div className="grid gap-4 sm:grid-cols-3">
<div className="sm:col-span-3"><Field id="o-p" label="Preț total, fără TVA" error={err} hint={over?`Peste bugetul estimat de ${lei(rfq.budget)}. Beneficiarul acoperă diferența din cofinanțare.`:`Buget estimat: ${lei(rfq.budget)}`}><div className="relative"><input ref={ref} id="o-p" type="number" min="0" inputMode="numeric" className={`${inputCls} num pr-10`} value={p} onChange={e=>{setP(e.target.value);setErr('')}}/><span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">lei</span></div></Field></div>
<Field id="o-d" label="Livrare (zile)"><input id="o-d" type="number" min="1" className={`${inputCls} num`} value={d} onChange={e=>setD(e.target.value)}/></Field>
<Field id="o-w" label="Garanție (luni)"><input id="o-w" type="number" min="0" className={`${inputCls} num`} value={w} onChange={e=>setW(e.target.value)}/></Field>
<Field id="o-v" label="Valabilitate"><select id="o-v" className={inputCls}><option>30 zile</option><option>60 zile</option><option>90 zile</option></select></Field>
</div>
<Field id="o-m" label="Specificații și mesaj"><textarea id="o-m" rows="3" className={`${inputCls} py-2`} placeholder="Model, caracteristici tehnice, condiții de livrare" value={m} onChange={e=>setM(e.target.value)}/></Field>
<div className="flex items-start gap-2 rounded-lg bg-navy-50 p-3 text-xs text-navy-800"><ShieldCheck className="mt-0.5 h-4 w-4 shrink-0" aria-hidden="true"/>Oferta pleacă în numele firmei tale, cu antetul și datele din profil. Declari că nu ai legături de rudenie sau de acționariat cu beneficiarul.</div>
<div className="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><Btn type="button" variant="ghost" onClick={onClose}>Renunță</Btn><Btn type="submit"><Send className="h-4 w-4" aria-hidden="true"/>Trimite oferta</Btn></div>
</form></div></div>,document.body)}

function App(){
const init=()=>{const h=location.hash.slice(1);return ['landing','aplicant','beneficiar','furnizor'].includes(h)?h:'landing'};
const [view,setV]=useState(init);const [msg,setMsg]=useState('');
const setView=v=>{setV(v);try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo({top:0})};
useEffect(()=>{const f=()=>setV(init());addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
return <div className="min-h-screen"><Nav view={view} setView={setView}/>
{view==='landing'&&<Landing setView={setView}/>}{view==='aplicant'&&<Aplicant toast={setMsg} setView={setView}/>}{view==='beneficiar'&&<Beneficiar toast={setMsg}/>}{view==='furnizor'&&<Furnizor toast={setMsg}/>}
<Toast msg={msg} onClose={()=>setMsg('')}/></div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
